aid: smalls
name: Smalls
description: 'Smalls is a New York City based direct-to-consumer pet food company
  founded in 2017 by Matt Michaelson and Calvin Bohn, selling gently cooked human-grade
  fresh cat food, freeze-dried raw and treats on a personalized monthly subscription
  that customers build through an onboarding quiz at smalls.com, shipped nationwide
  and, since 2023, also sold into brick-and-mortar retail and wholesale. The company
  had raised roughly $34 million as of March 2023 — including a $9M Series A round
  announced in 2020 and a $19M Series B closed in mid-2022 — from investors including
  Left Lane Capital, Founder Collective, Digitalis Ventures and R/GA Ventures, and
  its shares trade on the Forge Global secondary market. Smalls runs its own Remix
  storefront on Netlify backed by a Contentful CMS rather than a hosted commerce
  platform, and publishes no first-party developer program: contract discovery in
  August 2026 found no OpenAPI, Swagger, GraphQL endpoint, MCP server, A2A agent
  card, llms.txt or /.well-known documents on any smalls.com host, and no GitHub
  organization or public client library.'
